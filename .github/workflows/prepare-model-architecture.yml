name: Integrate reviewed Model architecture

on:
  push:
    branches: [feat/singing-model-architecture]
    paths: [.github/model-architecture-integration.py]

permissions:
  contents: write

concurrency:
  group: reviewed-model-architecture-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/singing-model-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply guarded editorial changes and check constructed cases
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python .github/model-architecture-integration.py
      - name: Refresh reviewed dependencies and run the pinned structure check
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/xiongxianfei/knowledge-practice-system/6a6e7aedc24581769fad435f4943856c1060e02a/validate.py \
            --output /tmp/kps-validate.py
          python /tmp/kps-validate.py . --accept-reviewed-summaries
          python /tmp/kps-validate.py .
      - name: Check the unchanged bundled audio
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          python tools/reference_audio.py
      - name: Remove one-off integration and commit only the reviewed paths
        run: |
          python - <<'PY'
          import subprocess
          allowed = {'README.md', 'docs/body-of-knowledge-outline.md', 'models/pitch-relationships.md', 'publication.json', 'references/open-music-theory-undated-simple-meter.md', 'references/open-music-theory-undated-major-scales.md', 'summary-dependencies.json'}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          PY
          git rm .github/model-architecture-integration.py .github/workflows/prepare-model-architecture.yml
          git add README.md docs/body-of-knowledge-outline.md models/pitch-relationships.md publication.json references/open-music-theory-undated-simple-meter.md references/open-music-theory-undated-major-scales.md summary-dependencies.json
          git diff --cached --check
          git config user.name "Singing KPS reviewed integration"
          git config user.email "noreply@github.com"
          test "$(git ls-remote origin refs/heads/feat/singing-model-architecture | cut -f1)" = "$GITHUB_SHA"
          git commit -m "docs: integrate reviewed Model coverage and dependency summaries"
          git push origin HEAD:refs/heads/feat/singing-model-architecture
