<text x="62" y="79" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="760" fill="#102A43" >Your first singing session</text><text x="64" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="420" fill="#567285" >One small attempt with a safe stopping point and an observable result</text><line x1="62" y1="143" x2="1217" y2="143" stroke="#D8E7ED" stroke-width="2"  stroke-linecap="round"/><rect x="47" y="187" width="266" height="345" rx="23" fill="#FFF" stroke="#DFE7EE" stroke-width="1.7" filter="url(#shadow)"/><circle cx="82" cy="228" r="21" fill="#2D8FAD" stroke="none" stroke-width="0"/><text x="82" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#FFF" text-anchor="middle">1</text><circle cx="180" cy="305" r="58" fill="#F1F7F9" stroke="none" stroke-width="0"/><path d="M153 304 L173 327 L208 282" fill="none" stroke="#2D8FAD" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="780" fill="#19374B" >Check comfort</text><text x="70" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Speak at an easy volume</text><text x="70" y="466" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Try one gentle hum</text><line x1="70" y1="487" x2="287" y2="487" stroke="#E5EBEF" stroke-width="2"  stroke-linecap="round"/><text x="70" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#2D8FAD" >Stop if uncomfortable</text><rect x="354" y="187" width="266" height="345" rx="23" fill="#FFF" stroke="#DFE7EE" stroke-width="1.7" filter="url(#shadow)"/><circle cx="389" cy="228" r="21" fill="#12917F" stroke="none" stroke-width="0"/><text x="389" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#FFF" text-anchor="middle">2</text><circle cx="487" cy="305" r="58" fill="#F1F7F9" stroke="none" stroke-width="0"/><path d="M446 329 L470 316 L490 284 L526 320" fill="none" stroke="#12917F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="446" cy="329" r="7" fill="#12917F"/><circle cx="490" cy="284" r="7" fill="#12917F"/><circle cx="526" cy="320" r="7" fill="#12917F"/><text x="377" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="780" fill="#19374B" >Explore pitch</text><text x="377" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Hum start → higher</text><text x="377" y="466" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >→ return, then rest</text><line x1="377" y1="487" x2="594" y2="487" stroke="#E5EBEF" stroke-width="2"  stroke-linecap="round"/><text x="377" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#12917F" >Do not force range</text><rect x="661" y="187" width="266" height="345" rx="23" fill="#FFF" stroke="#DFE7EE" stroke-width="1.7" filter="url(#shadow)"/><circle cx="696" cy="228" r="21" fill="#D98B42" stroke="none" stroke-width="0"/><text x="696" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#FFF" text-anchor="middle">3</text><circle cx="794" cy="305" r="58" fill="#F1F7F9" stroke="none" stroke-width="0"/><circle cx="757" cy="304" r="9" fill="#D98B42" stroke="none" stroke-width="0"/><circle cx="781" cy="304" r="9" fill="#D98B42" stroke="none" stroke-width="0"/><circle cx="805" cy="304" r="9" fill="#D98B42" stroke="none" stroke-width="0"/><circle cx="829" cy="304" r="9" fill="#C9D4DC" stroke="none" stroke-width="0"/><text x="684" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="780" fill="#19374B" >Keep four beats</text><text x="684" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Tap: 1 · 2 · 3 · 4</text><text x="684" y="466" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Sound on 1, 2, 3</text><line x1="684" y1="487" x2="901" y2="487" stroke="#E5EBEF" stroke-width="2"  stroke-linecap="round"/><text x="684" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#D98B42" >Silent on 4</text><rect x="968" y="187" width="266" height="345" rx="23" fill="#FFF" stroke="#DFE7EE" stroke-width="1.7" filter="url(#shadow)"/><circle cx="1003" cy="228" r="21" fill="#756DAD" stroke="none" stroke-width="0"/><text x="1003" y="236" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#FFF" text-anchor="middle">4</text><circle cx="1101" cy="305" r="58" fill="#F1F7F9" stroke="none" stroke-width="0"/><rect x="1071" y="272" width="60" height="70" rx="8" fill="none" stroke="#756DAD" stroke-width="6"/><path d="M1082 291 L1092 299 L1109 282 M1082 318 L1092 326 L1109 309" fill="none" stroke="#756DAD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="991" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="780" fill="#19374B" >Combine &amp; reflect</text><text x="991" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >One short attempt</text><text x="991" y="466" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#546F80" >Notice what happened</text><line x1="991" y1="487" x2="1208" y2="487" stroke="#E5EBEF" stroke-width="2"  stroke-linecap="round"/><text x="991" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#756DAD" >Choose next action</text><path d="M318 352 L349 352 M625 352 L656 352 M932 352 L963 352" stroke="#77A4B4" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="47" y="573" width="1187" height="93" rx="19" fill="#FDF0EB" stroke="#F3DDD5" stroke-width="1.7" /><circle cx="85" cy="618" r="20" fill="#CF5A46" stroke="none" stroke-width="0"/><text x="85" y="626" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="125" y="612" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#A34134" >STOP CONDITION</text><text x="322" y="612" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="630" fill="#6D403D" >Do not sing through pain, new hoarseness or strain.</text><text x="125" y="647" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="480" fill="#825F5C" >For persistent voice problems, seek assessment from a qualified healthcare professional.</text>
