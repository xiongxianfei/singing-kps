<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
<title id="title">Beat versus rhythm</title>
<desc id="description">Four evenly spaced beats continue while the singer hums on beats one through three and rests silently on beat four.</desc>
<metadata>Original editable SVG diagram for Singing KPS. MIT-licensed repository artwork. Source meaning and limitations are explained in the owning Markdown document. Diagram is schematic, not a medical assessment or a precise measurement.</metadata>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFD"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#193E56" flood-opacity=".075"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75A3B2"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#page)"/>
<circle cx="1210" cy="90" r="135" fill="#D7EFF2" opacity=".45"/>
<circle cx="62" cy="700" r="82" fill="#DDE9FB" opacity=".44"/>
<text x="62" y="79" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="760" fill="#102A43" >Beat and rhythm are not the same</text><text x="64" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="420" fill="#567285" >Keep four evenly spaced beats; make sounds on 1, 2, 3, then rest on 4</text><line x1="62" y1="143" x2="1217" y2="143" stroke="#D8E7ED" stroke-width="2"  stroke-linecap="round"/><rect x="55" y="171" width="1170" height="398" rx="25" fill="#FFF" stroke="#DCE8EE" stroke-width="1.7" filter="url(#shadow)"/><text x="79" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="790" fill="#44687A" >BEAT</text><text x="79" y="439" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="790" fill="#44687A" >VOICE</text><line x1="235" y1="245" x2="235" y2="503" stroke="#DFE9EE" stroke-width="3" stroke-dasharray="7 10" stroke-linecap="round"/><circle cx="235" cy="278" r="31" fill="#0E90A0" stroke="none" stroke-width="0"/><text x="235" y="288" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="780" fill="#FFF" text-anchor="middle">1</text><line x1="504" y1="245" x2="504" y2="503" stroke="#DFE9EE" stroke-width="3" stroke-dasharray="7 10" stroke-linecap="round"/><circle cx="504" cy="278" r="31" fill="#0E90A0" stroke="none" stroke-width="0"/><text x="504" y="288" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="780" fill="#FFF" text-anchor="middle">2</text><line x1="773" y1="245" x2="773" y2="503" stroke="#DFE9EE" stroke-width="3" stroke-dasharray="7 10" stroke-linecap="round"/><circle cx="773" cy="278" r="31" fill="#0E90A0" stroke="none" stroke-width="0"/><text x="773" y="288" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="780" fill="#FFF" text-anchor="middle">3</text><line x1="1042" y1="245" x2="1042" y2="503" stroke="#DFE9EE" stroke-width="3" stroke-dasharray="7 10" stroke-linecap="round"/><circle cx="1042" cy="278" r="31" fill="#0E90A0" stroke="none" stroke-width="0"/><text x="1042" y="288" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="780" fill="#FFF" text-anchor="middle">4</text><rect x="152" y="397" width="166" height="79" rx="20" fill="#E4F4EF" stroke="#B7DED4" stroke-width="1.7" /><text x="235" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#09796F" text-anchor="middle">HUM</text><rect x="421" y="397" width="166" height="79" rx="20" fill="#E4F4EF" stroke="#B7DED4" stroke-width="1.7" /><text x="504" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#09796F" text-anchor="middle">HUM</text><rect x="690" y="397" width="166" height="79" rx="20" fill="#E4F4EF" stroke="#B7DED4" stroke-width="1.7" /><text x="773" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#09796F" text-anchor="middle">HUM</text><rect x="959" y="397" width="166" height="79" rx="20" fill="#FBFCFE" stroke="#BFCBD4" stroke-width="1.7" stroke-dasharray="9 7"/><text x="1042" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#65798A" text-anchor="middle">REST</text><text x="235" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#587386" text-anchor="middle">SOUND</text><text x="504" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#587386" text-anchor="middle">SOUND</text><text x="773" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#587386" text-anchor="middle">SOUND</text><text x="1042" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750" fill="#587386" text-anchor="middle">SILENT</text><rect x="55" y="597" width="1170" height="76" rx="20" fill="#E6F4F7" stroke="#D8EAEF" stroke-width="1.7" /><text x="83" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0C778A" >BEAT</text><text x="183" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" fill="#35566A" >The even pulse keeps going</text><text x="688" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0C778A" >RHYTHM</text><text x="805" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="560" fill="#35566A" >When sounds and silence occur</text><text x="83" y="660" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="520" fill="#587386" >Beat 4 exists even when the voice is silent.</text>
</svg>
