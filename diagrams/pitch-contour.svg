<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
<title id="title">Pitch direction for a beginner</title>
<desc id="description">A three-note contour in chronological order: starting pitch, a slightly higher pitch, then a return toward the start; no absolute frequency or loudness is implied.</desc>
<metadata>Original editable SVG diagram for Singing KPS. No external artwork has been incorporated. Source meaning and limitations are explained in the owning Markdown document. Diagram is schematic, not a medical assessment or a precise measurement.</metadata>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFD"/><stop offset="1" stop-color="#ECF5FA"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#193E56" flood-opacity=".075"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#75A3B2"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#page)"/>
<circle cx="1210" cy="90" r="135" fill="#D7EFF2" opacity=".45"/>
<circle cx="62" cy="700" r="82" fill="#DDE9FB" opacity=".44"/>
<text x="62" y="79" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="760" fill="#102A43" >Pitch: start, higher, return</text><text x="64" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="420" fill="#567285" >The vertical position represents pitch height; time moves from left to right</text><line x1="62" y1="143" x2="1217" y2="143" stroke="#D8E7ED" stroke-width="2"  stroke-linecap="round"/><rect x="55" y="173" width="1170" height="414" rx="25" fill="#FFFFFF" stroke="#DFE9EF" stroke-width="1.7" filter="url(#shadow)"/><line x1="169" y1="242" x2="169" y2="515" stroke="#8DAAB9" stroke-width="4"  stroke-linecap="round"/><line x1="169" y1="515" x2="1153" y2="515" stroke="#8DAAB9" stroke-width="4"  stroke-linecap="round"/><path d="M169 245 L169 228 M159 246 L169 228 L179 246" fill="none" stroke="#8DAAB9" stroke-width="4" stroke-linecap="round"/>
<path d="M1140 504 L1154 515 L1140 526" fill="none" stroke="#8DAAB9" stroke-width="4" stroke-linecap="round"/><text x="85" y="253" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" fill="#4D7080" >HIGHER</text><text x="92" y="490" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" fill="#4D7080" >LOWER</text><text x="1014" y="557" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="750" fill="#4D7080" >LATER IN TIME</text><line x1="205" y1="422" x2="1110" y2="422" stroke="#DCE8EC" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/><line x1="205" y1="280" x2="1110" y2="280" stroke="#DCE8EC" stroke-width="2" stroke-dasharray="8 10" stroke-linecap="round"/><path d="M340 418 C475 415 520 284 645 284 S845 418 951 418" fill="none" stroke="#0D8F8B" stroke-width="9" stroke-linecap="round"/><circle cx="340" cy="418" r="19" fill="#0D8F8B" stroke="#FFFFFF" stroke-width="6"/><circle cx="645" cy="284" r="19" fill="#D98D4A" stroke="#FFFFFF" stroke-width="6"/><circle cx="951" cy="418" r="19" fill="#0D8F8B" stroke="#FFFFFF" stroke-width="6"/><text x="340" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="790" fill="#176C78" text-anchor="middle">START</text><text x="645" y="242" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="790" fill="#B46924" text-anchor="middle">HIGHER</text><text x="951" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="790" fill="#176C78" text-anchor="middle">RETURN</text><text x="340" y="471" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="720" fill="#4D7080" text-anchor="middle">1</text><text x="645" y="336" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="720" fill="#8A622F" text-anchor="middle">2</text><text x="951" y="471" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="720" fill="#4D7080" text-anchor="middle">3</text><rect x="75" y="612" width="336" height="44" rx="16" fill="#EEF6FA" stroke="#EEF6FA" stroke-width="1.7" /><text x="243" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="620" fill="#244A62" text-anchor="middle">Not a fixed note or interval</text><rect x="472" y="612" width="336" height="44" rx="16" fill="#E8F7F2" stroke="#E8F7F2" stroke-width="1.7" /><text x="640" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="620" fill="#13695E" text-anchor="middle">Higher does not mean louder</text><rect x="869" y="612" width="336" height="44" rx="16" fill="#FFF4E6" stroke="#FFF4E6" stroke-width="1.7" /><text x="1037" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="620" fill="#93632B" text-anchor="middle">Stay in a comfortable range</text>
</svg>
